<!--
  DeskTabs Zeit-Auswertung. DeskTabs ersetzt beim Oeffnen den Platzhalter im Datenblock
  unten durch die Zeilen aus timelog\*.csv (plus den laufenden Aufenthalt) und oeffnet die
  Kopie im Standardbrowser. Alles laeuft offline in dieser Datei, nichts wird gesendet.
  Direkt geoeffnet (Platzhalter noch da) zeigt die Seite erfundene Beispieldaten.
  Zaehlregeln: wie im Abschnitt "Zeit-Log" der README/AGENTS.md (nur state=active zaehlt,
  Gespraechszeit gehoert dem Kunden des Gespraechs, Desktop-ID vor Name).
-->
<style>
:root{
  --bg:#f3f3f3; --card:#fff; --ink:#1f1f1f; --muted:#6b6b6b; --line:#e3e3e3;
  --chip:#ececec; --chip-on:#1f1f1f; --chip-on-ink:#fff; --hover:#f5f5f5; --track:#eee;
  --accent:#2f6fde; --pause:#d6d6d6; --up:#2e7d32; --down:#c62828;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1c1c; --card:#262626; --ink:#ececec; --muted:#9a9a9a; --line:#363636;
    --chip:#333; --chip-on:#ececec; --chip-on-ink:#1c1c1c; --hover:#2d2d2d; --track:#333;
    --accent:#6ea2ff; --pause:#4a4a4a; --up:#81c784; --down:#ef9a9a;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1c1c; --card:#262626; --ink:#ececec; --muted:#9a9a9a; --line:#363636;
  --chip:#333; --chip-on:#ececec; --chip-on-ink:#1c1c1c; --hover:#2d2d2d; --track:#333;
  --accent:#6ea2ff; --pause:#4a4a4a; --up:#81c784; --down:#ef9a9a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
.wrap{max-width:1160px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
header img{width:36px;height:36px;display:block}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font:700 20px/1.15 "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;letter-spacing:-.2px}
.brand span{font-size:13px;color:var(--muted)}
.asof{font-size:12px;color:var(--muted);text-align:right}
.muted,.sub{color:var(--muted)}
.sub{font-size:13px}
.sp{flex:1}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;min-width:36px}
.iconbtn:disabled{opacity:.35;cursor:default}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:12px}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{color:var(--muted);font-size:12px;margin-right:2px}
.chip{border:0;background:var(--chip);border-radius:999px;padding:5px 11px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.chip.desk{display:inline-flex;align-items:center;gap:6px}
.chip.desk[aria-pressed="true"]{background:var(--chip);color:var(--ink)}
.chip.desk[aria-pressed="false"]{opacity:.4;text-decoration:line-through}
.chip.link{background:transparent;color:var(--accent);padding:5px 6px}
.dot{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.nav{display:flex;align-items:center;gap:6px}
.period{font:600 16px/1.2 "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;min-width:240px;text-align:center}
input[type=date]{font:inherit;color:inherit;background:var(--chip);border:0;border-radius:8px;padding:4px 8px;color-scheme:light dark}
.custom{display:none;gap:6px;align-items:center}
.custom.on{display:flex}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.kpi b{display:block;font:600 21px/1.25 "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12px;display:block}
.kpi .delta{font-size:12px;margin-top:2px}
.up{color:var(--up)} .down{color:var(--down)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{font-weight:400;color:var(--muted)}
svg{display:block}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
svg .gl{stroke:var(--line)}
svg .hit{cursor:pointer}
svg .hit:hover rect.bg{fill:var(--hover)}
svg rect.bg{fill:transparent}
svg text.lab{fill:var(--ink)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--hover)}
tr.detail td{background:var(--hover);padding:6px 8px 10px 34px;font-size:13px}
tr.pause td{color:var(--muted)}
tr.sumrow td{font-weight:600;border-bottom:0}
.name{display:flex;align-items:center;gap:8px;font-weight:500}
.caret{color:var(--muted);width:12px;display:inline-block;transition:transform .15s}
tr.open .caret{transform:rotate(90deg)}
.track{height:10px;background:var(--track);border-radius:5px;overflow:hidden;display:flex;min-width:100px}
.track i{display:block;height:100%}
.call{color:var(--muted);font-size:12px;white-space:nowrap}
.mini{display:grid;grid-template-columns:auto 40px auto;gap:2px 14px;max-width:560px}
.mini .m{color:var(--muted)}
.two{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.pauses div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
.pauses div:last-child{border:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 11px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:3px 10px;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.seg button:disabled{opacity:.4;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.banner{border:1px dashed var(--line);border-radius:10px;padding:8px 12px;color:var(--muted);font-size:12px;margin-bottom:12px}
.banner.err{border-style:solid;border-color:var(--down);color:var(--down)}
.printinfo{display:none}
footer{color:var(--muted);font-size:12px;margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 16px}
kbd{font:11px ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.hide-s{display:none}.period{min-width:0}}
@media print{
  :root,:root[data-theme="dark"]{--bg:#fff;--card:#fff;--ink:#000;--muted:#555;--line:#ccc;--hover:#fff;--track:#eee;--pause:#d6d6d6}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:12px}
  .wrap{max-width:none;padding:0}
  .panel,.noprint,#themeBtn,#printBtn,.seg,.btn,.banner:not(.err){display:none!important}
  .printinfo{display:block;margin:0 0 10px;font-size:13px}
  .card,.kpi{break-inside:avoid;border-color:#ccc}
  .kpis{grid-template-columns:repeat(5,1fr)}
  tr.row{cursor:default}
}
</style>
</head>

/* ---------- Diagramme (SVG, ohne Bibliothek) ---------- */
const W = 1000;
const emptyMsg = () => `<div class="empty">${esc(ROWS.length ? S.none : S.nolog)}</div>`;
function hourSpan(keys) {
  let h0 = 24, h1 = 0;
  for (const k of keys) { const p = SPAN[k]; if (!p) continue; h0 = Math.min(h0, hpos(p.s, k)); h1 = Math.max(h1, hpos(p.e, k)); }
  if (h1 <= h0) return [8, 18];
  h0 = Math.floor(h0); h1 = Math.min(24, Math.ceil(h1));
  if (h1 - h0 < 8) { const m = (h0 + h1) / 2; h0 = Math.max(0, Math.floor(m - 4)); h1 = Math.min(24, h0 + 8); }
  return [h0, h1];
}
const title = t => `<title>${esc(t)}</title>`;
function rowTip(r) {
  let t = `${clock(r.s)} – ${r.live && +r.e === +NOW ? S.now : clock(r.e)} (${hm(r.sec)} h)\n`;
  t += r.state === "active" ? r.own + (r.sub ? " · " + r.sub : "") : S.st[r.state] || r.state;
  if (r.call) t += `\n${S.callOf}: ${r.callDesk}${r.callSub ? " · " + r.callSub : ""}`;
  return t;
}
// Eine Spur: Bloecke je Zeile (Desktop farbig, Pausen grau, nur innerhalb der Arbeitsspanne)
function lane(rows, k, x0, x1, h0, h1, y, h, onlyCalls) {
  const sx = d => x0 + (x1 - x0) * (Math.min(Math.max(hpos(d, k), h0), h1) - h0) / (h1 - h0);
  const p = SPAN[k]; let s = "";
  for (const r of rows) {
    if (r.state === "off" && !onlyCalls) continue;
    if (onlyCalls && !r.call) continue;
    let rs = r.s, re = r.e;
    if (r.state !== "active") { if (!p) continue; rs = r.s > p.s ? r.s : p.s; re = r.e < p.e ? r.e : p.e; if (re <= rs) continue; }
    const xa = sx(rs), xb = sx(re); if (xb - xa <= 0) continue;
    const fill = onlyCalls ? colorOf(r.callDesk) : r.state === "active" ? colorOf(r.own) : "var(--pause)";
    const faded = r.state === "active" && st.off.has(onlyCalls ? r.callDesk : r.own);
    s += `<rect x="${xa}" y="${y}" width="${Math.max(xb - xa, 1)}" height="${h}" fill="${fill}"${faded ? ' opacity=".18"' : ""}>${title(rowTip(r))}</rect>`;
  }

}
function hourAxis(x0, x1, h0, h1, y0, y1) {
  let s = "";
  const stp = (h1 - h0) > 14 ? 2 : 1;
  for (let h = h0; h <= h1; h += stp) {
    const x = x0 + (x1 - x0) * (h - h0) / (h1 - h0);
    s += `<line class="gl" x1="${x}" x2="${x}" y1="${y0}" y2="${y1}"/><text x="${x}" y="${y1 + 13}" text-anchor="middle">${pad(h % 24)}:00</text>`;
  }

}
// gestapelte Minuten je Stunde; div = Zahl der Tage (Schnitt)
function hourColumns(bins, div, h0, h1, L, R, top, hh) {
  let s = "";
  for (let m = 0; m <= 60; m += 30) { const yy = top + hh - hh * m / 60; s += `<line class="gl" x1="${L}" x2="${R}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${m}′</text>`; }
  const bw = (R - L) / (h1 - h0);
  for (let h = h0; h < h1; h++) {
    let yy = top + hh; const x = L + (h - h0) * bw + bw * 0.15, w = bw * 0.7;
    for (const [n, sec] of Object.entries(bins[h]).sort((p, q) => q[1] - p[1])) {
      const hgt = hh * Math.min(sec / div, 3600) / 3600; yy -= hgt;
      s += `<rect x="${x}" y="${yy}" width="${w}" height="${hgt}" fill="${colorOf(n)}">${title(`${pad(h)}:00–${pad(h + 1)}:00 · ${n}: ${Math.round(sec / div / 60)} min`)}</rect>`;
    }

  }

}
function chartDay(k, all, work) {

  if (!SPAN[k]) { $("chart").innerHTML = emptyMsg(); return []; }

  s += `<text class="lab" x="0" y="${y + 22}">${esc(S.lane_desk)}</text>` + lane(all, k, L, R, h0, h1, y, 34, false); y += 42;
  if (hasCall) { s += `<text class="lab" x="0" y="${y + 11}">${esc(S.lane_call)}</text>` + lane(all, k, L, R, h0, h1, y + 2, 10, true); y += 20; }
  s = hourAxis(L, R, h0, h1, 2, y) + s; y += 34;
  s += `<text class="lab" x="0" y="${y + 8}">${esc(S.c_hours)}</text>`;

function chartCols(a, b, work) {
  const n = nDays(a, b), weekly = n > 62;
  $("chartTitle").textContent = weekly ? S.c_weeks : S.c_cols; $("chartHint").textContent = S.c_colsHint;
  const buckets = [];
  if (weekly) { for (let m = addDays(a, -((a.getDay() + 6) % 7)); m <= b; m = addDays(m, 7)) buckets.push({d: m, e: addDays(m, 6), lab: `${S.kw} ${isoWeek(m)}`}); }
  else for (let d = a; d <= b; d = addDays(d, 1)) buckets.push({d, e: d, lab: n > 14 ? `${pad(d.getDate())}.` : dShort(d)});
  for (const x of buckets) { const l = dkey(x.d), h = dkey(x.e); x.m = {}; x.t = 0; for (const r of work) if (r.day >= l && r.day <= h) { x.m[r.desk] = (x.m[r.desk] || 0) + r.sec; x.t += r.sec; } }

  const stp = maxS / 3600 > 30 ? 10 : maxS / 3600 > 12 ? 4 : 2;
  const maxH = Math.max(stp * 2, Math.ceil(maxS / 3600 / stp) * stp);
  const H = 210, L = 36, B = 22, T = 6, bw = (W - L) / buckets.length;
  let s = "";
  for (let h = 0; h <= maxH; h += stp) { const y = T + (H - B - T) * (1 - h / maxH); s += `<line class="gl" x1="${L}" x2="${W}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${h} h</text>`; }
  const labEvery = buckets.length > 40 ? 4 : buckets.length > 20 ? 2 : 1;
  buckets.forEach((x, i) => {
    const xb0 = L + i * bw, w = Math.max(bw * 0.66, 2), xb = xb0 + (bw - w) / 2; let y = H - B;
    const tip = weekly ? `${x.lab} (${fmt(x.d, {day: "2-digit", month: "2-digit"})}–${fmt(x.e, {day: "2-digit", month: "2-digit"})})` : fmt(x.d, {weekday: "long", day: "2-digit", month: "2-digit"});
    let g = `<g class="hit" data-d="${dkey(x.d)}" data-w="${weekly ? 1 : 0}"><rect class="bg" x="${xb0}" y="${T}" width="${bw}" height="${H - B - T}">${title(tip + ": " + hm(x.t) + " h")}</rect>`;
    for (const [nm, sec] of Object.entries(x.m).sort((p, q) => q[1] - p[1])) {

    }

function renderTable(day, all, work, total, calls) {

  st.cache.items = null;
  if (st.group === "chron") {
    H.innerHTML = `<tr><th>${esc(S.h_from)}</th><th>${esc(S.h_desk)}</th><th class="r">${esc(S.h_dur)}</th><th class="r hide-s">${esc(S.h_calls)}</th></tr>`;
    const rows = chronRows(all);
    B.innerHTML = rows.length ? rows.map(r => {
      const p = r.state !== "active", faded = !p && st.off.has(r.own) ? ' style="opacity:.45"' : "";
      const nm = p ? `<span class="dot" style="background:var(--pause)"></span>${esc(S.st[r.state] || r.state)}`
                   : `<span class="dot" style="background:${colorOf(r.own)}"></span>${esc(r.own)}${r.sub ? ` <span class="muted">· ${esc(r.sub)}</span>` : ""}`;
      return `<tr class="${p ? "pause" : ""}"${faded}><td>${clock(r.s)} – ${r.live && +r.e === +NOW ? esc(S.now) : clock(r.e)}</td><td><div class="name" style="font-weight:${p ? 400 : 500}">${nm}</div></td><td class="r">${hm(r.sec)} h</td><td class="r hide-s call">${r.call ? "☎ " + esc(r.callDesk) + (r.callSub ? " · " + esc(r.callSub) : "") : ""}</td></tr>`;
    }).join("") : `<tr><td colspan="4">${emptyMsg()}</td></tr>`;
    return;
  }
  if (st.group === "calls") {
    H.innerHTML = `<tr><th>${esc(S.h_when)}</th><th>${esc(S.h_with)}</th><th class="r">${esc(S.h_dur)}</th></tr>`;
    B.innerHTML = calls.length ? calls.slice().reverse().map(c => `<tr class="row" data-day="${c.day}"><td>${esc(day ? "" : dShort(c.s) + ", ")}${clock(c.s)} – ${c.live && +c.e === +NOW ? esc(S.now) : clock(c.e)}</td>`
      + `<td><div class="name"><span class="dot" style="background:${colorOf(c.desk)}"></span>${esc(c.desk)}${c.sub ? ` <span class="muted">· ${esc(c.sub)}</span>` : ""}</div></td><td class="r">${hmS(c.sec)} h</td></tr>`).join("")
      + `<tr class="sumrow"><td>${esc(S.h_sum)}</td><td>${calls.length} ${esc(S.k_calls)}</td><td class="r">${hmS(sum(calls))} h</td></tr>`
      : `<tr><td colspan="3"><div class="empty">${esc(S.noCalls)}</div></td></tr>`;
    if (!day) B.querySelectorAll("tr.row").forEach(t => t.onclick = () => goDay(fromKey(t.dataset.day)));
    return;
  }
  H.innerHTML = `<tr><th>${esc(S["h_" + st.group])}</th><th class="hide-s"></th><th class="r">${esc(S.h_time)}</th><th class="r">${esc(S.h_share)}</th><th class="r hide-s">${esc(S.h_calls)}</th></tr>`;
  const groups = {};
  for (const r of work) (groups[groupKey(r)] ||= []).push(r);
  const keys = Object.keys(groups);
  if (st.group === "day") keys.sort().reverse();
  else if (st.group === "wday") keys.sort();
  else keys.sort((x, y) => sum(groups[y]) - sum(groups[x]));
  const max = Math.max(1, ...keys.map(x => sum(groups[x])));
  const items = keys.map(x => ({k: x, list: groups[x], sec: sum(groups[x]), csec: sum(groups[x].filter(r => r.call))}));
  st.cache.items = items;
  let html = "";
  items.forEach((it, i) => {
    const open = st.open.has(it.k);
    let label, track;
    if (st.group === "day" || st.group === "wday") {
      label = `<span class="caret">›</span>${esc(st.group === "day" ? fmt(fromKey(it.k), {weekday: "long", day: "2-digit", month: "2-digit"}) : WDAYS[+it.k])}`;
      const m = {}; for (const r of it.list) m[r.desk] = (m[r.desk] || 0) + r.sec;
      track = Object.entries(m).sort((p, q) => q[1] - p[1]).map(([n, v]) => `<i style="width:${v / max * 100}%;background:${colorOf(n)}" title="${esc(n)} ${hm(v)} h"></i>`).join("");
    } else {
      const [dn, sb] = it.k.split("\u0000");
      label = `<span class="caret">›</span><span class="dot" style="background:${colorOf(dn)}"></span>${esc(dn)}${sb ? ` <span class="muted" style="font-weight:400">· ${esc(sb)}</span>` : ""}`;
      track = `<i style="width:${it.sec / max * 100}%;background:${colorOf(dn)}"></i>`;
    }
    html += `<tr class="row${open ? " open" : ""}" data-i="${i}"><td><div class="name">${label}</div></td><td class="hide-s" style="width:36%"><div class="track">${track}</div></td><td class="r"><b>${hm(it.sec)}</b> h</td><td class="r">${total ? Math.round(it.sec / total * 100) : 0} %</td><td class="r hide-s call">${it.csec ? "☎ " + hmS(it.csec) + " h" : ""}</td></tr>`;
    if (open) html += `<tr class="detail"><td colspan="5">${detail(it, day)}</td></tr>`;
  });
  if (items.length > 1) html += `<tr class="sumrow"><td>${esc(S.h_sum)}</td><td class="hide-s"></td><td class="r">${hm(total)} h</td><td class="r">100 %</td><td class="r hide-s call">${work.some(r => r.call) ? "☎ " + hmS(sum(work.filter(r => r.call))) + " h" : ""}</td></tr>`;
  B.innerHTML = items.length ? html : `<tr><td colspan="5">${emptyMsg()}</td></tr>`;
  B.querySelectorAll("tr.row").forEach(t => t.onclick = e => {
    if (e.target.closest("a")) return;
    const k = items[+t.dataset.i].k; st.open.has(k) ? st.open.delete(k) : st.open.add(k); render();
  });
}
// Ablauf eines Tages: Aufenthalte und Pausen innerhalb der Arbeitsspanne
function chronRows(all) {
  const out = [];
  for (const r of all) {
    if (r.state === "active") { out.push(r); continue; }
    if (r.state === "off" && !SPAN[r.day]) continue;
    const p = SPAN[r.day]; if (!p) continue;
    const s = r.s > p.s ? r.s : p.s, e = r.e < p.e ? r.e : p.e;
    if (e > s) out.push({...r, s, e, sec: Math.round((e - s) / 1000)});
  }
  return out;
}
function detail(it, day) {
  const by = []; let head, extra = "";
  if (st.group === "day" || st.group === "wday") {
    head = S.d_desks; const m = {}; for (const r of it.list) m[r.desk] = (m[r.desk] || 0) + r.sec;
    for (const [n, v] of Object.entries(m).sort((p, q) => q[1] - p[1])) by.push([n, v]);
    if (st.group === "day") extra = `<div style="margin-top:6px"><a href="#" data-day="${it.k}">${esc(S.openDay)}</a></div>`;
    else { const nd = new Set(it.list.map(r => r.day)).size; head = tr(S.d_wday, nd, hm(it.sec / nd)); }
  } else {
    if (st.group === "desk") { const m = {}; for (const r of it.list) if (r.dsub) m[r.dsub] = (m[r.dsub] || 0) + r.sec; for (const [n, v] of Object.entries(m).sort((p, q) => q[1] - p[1])) by.push(["▸ " + n, v]); }
    head = by.length ? S.d_subs_days : S.d_days;
    if (!day) { const m = {}; for (const r of it.list) m[r.day] = (m[r.day] || 0) + r.sec; for (const d of Object.keys(m).sort().reverse()) by.push([dShort(fromKey(d)), m[d], d]); }
  }
  return `<div class="sub" style="margin-bottom:4px">${esc(head)}</div><div class="mini">` +
    by.map(([n, v, d]) => `<span>${d ? `<a href="#" data-day="${d}">${esc(n)}</a>` : esc(n)}</span><span></span><span class="m">${hm(v)} h · ${Math.round(v / it.sec * 100)} %</span>`).join("") + `</div>` + extra;
}
$("tbody").addEventListener("click", e => {
  const a = e.target.closest("a[data-day]"); if (!a) return;
  e.preventDefault(); e.stopPropagation(); goDay(fromKey(a.dataset.day));
}, true);

/* ---------- Export (CSV fuer Excel: Semikolon und Dezimalkomma auf Deutsch, UTF-8 mit BOM) ---------- */
function download(name, lines) {
  const q = v => { v = String(v); return v.includes(CSV_SEP) || /["\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const csv = "\ufeff" + lines.map(l => l.map(q).join(CSV_SEP)).join("\r\n") + "\r\n";
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv;charset=utf-8"}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const fname = kind => { const {a, b} = st.cache; return `desktabs-${kind}_${dkey(a)}${+a === +b ? "" : "_" + dkey(b)}.csv`; };
const C = S.csv;
const rowHead = [C.start, C.end, C.sec, C.dec, C.desk, C.sub, C.state, C.call, C.counted, C.src];
const rowLine = r => [isoL(r.s), isoL(r.e), r.sec, dec(r.sec), r.state === "active" ? r.own : "", r.sub, r.state,
  r.call ? r.callDesk + (r.callSub ? " / " + r.callSub : "") : "", r.state === "active" ? r.desk + (r.dsub ? " / " + r.dsub : "") : "", r.live ? "live" : r.src];
$("expSum").onclick = () => {
  const {items, total, all, calls} = st.cache, g = st.group;
  if (g === "chron") return download(fname(S.fn.chron), [rowHead, ...chronRows(all).map(rowLine)]);
  if (g === "calls") return download(fname(S.fn.calls), [[C.date, C.start, C.end, C.hm, C.dec, C.desk, C.sub],
    ...calls.map(c => [dkey(c.s), clock(c.s), clock(c.e), hm(c.sec), dec(c.sec), c.desk, c.sub]), [C.sum, "", "", hm(sum(calls)), dec(sum(calls)), "", ""]]);
  const share = s => total ? Math.round(s / total * 100) : 0;
  let head, line;
  if (g === "sub") { head = [C.desk, C.sub]; line = it => it.k.split("\u0000"); }
  else if (g === "day") { head = [C.date, C.wday]; line = it => [it.k, WDAYS[(fromKey(it.k).getDay() + 6) % 7]]; }
  else if (g === "wday") { head = [C.wday, C.days, C.avg]; line = it => { const n = new Set(it.list.map(r => r.day)).size; return [WDAYS[+it.k], n, hm(it.sec / n)]; }; }
  else { head = [C.desk]; line = it => [it.k]; }
  const lines = [[...head, C.hm, C.dec, C.share, C.calls], ...items.map(it => [...line(it), hm(it.sec), dec(it.sec), share(it.sec), hm(it.csec)])];
  lines.push([C.sum, ...head.slice(1).map(() => ""), hm(total), dec(total), 100, hm(sum(st.cache.work.filter(r => r.call)))]);
  download(fname(S.fn[g]), lines);
};
// Einzelzeilen: alle Zeilen des Zeitraums, ohne Arbeitszeit ausgeblendeter Desktops
$("expRows").onclick = () => download(fname(S.fn.rows), [rowHead, ...st.cache.all.filter(r => r.state !== "active" || !st.off.has(r.desk)).map(rowLine)]);

/* ============================ Beispieldaten ============================ */
function demoData() {
  const desks = [
    {id: "{D0}", name: "Standard", color: "#8A8F98", w: 1, subs: []},
    {id: "{D1}", name: "Acme Bakery", color: "#E5471D", w: 3, subs: []},
    {id: "{D2}", name: "Miller & Sons", color: "#1565C0", w: 3, subs: []},
    {id: "{D3}", name: "Web projects", color: "#2E7D32", w: 2, subs: ["Site updates", "Corner Café", "Dental practice"]},
    {id: "{D4}", name: "Northlight Press", color: "#6A1B9A", w: 2, subs: []},
    {id: "{D5}", name: "Own projects", color: "#EF6C00", w: 0, subs: ["Bookkeeping", "Website"]}];
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647; const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const now = new Date(); now.setSeconds(0, 0); const today = midnight(now);
  const iso = d => `${dkey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  const lines = ["start,end,seconds,desktop_index,desktop_name,subproject,state,desktop_id,source,activity"]; let prevEnd = null;
  const push = (s, e, dk, sub, state, src, act) => { if (e <= s) return; lines.push([iso(s), iso(e), Math.round((e - s) / 1000), dk ? desks.indexOf(dk) + 1 : "", `"${dk ? dk.name : ""}"`, `"${sub || ""}"`, state, dk ? dk.id : "", src, `"${act || ""}"`].join(",")); };
  for (let d = addDays(today, -75); d <= today; d = addDays(d, 1)) {
    const isToday = +d === +today, wd = d.getDay(); if ((wd === 0 || wd === 6) && !isToday) continue;
    let t = new Date(d); t.setHours(7, ri(35, 80), ri(0, 59));
    if (isToday && t > now) break;
    const end = new Date(d); if (isToday) end.setTime(+now); else end.setHours(16, ri(20, 110), 0);
    if (prevEnd) push(prevEnd, t, null, "", "off", "", "");
    const focus = [desks[ri(1, 4)], desks[ri(1, 5)]];
    const lunch = new Date(d); lunch.setHours(12, ri(0, 30)); let lunchDone = false, first = true;
    const calls = [ri(9, 11) * 60 + ri(0, 59), ri(13, 16) * 60 + ri(0, 59)].filter(() => rnd() < 0.6);
    while (t < end) {
      const mins = t.getHours() * 60 + t.getMinutes();
      if (!lunchDone && t >= lunch) { const e = new Date(+t + ri(28, 48) * 6e4); push(t, e, null, "", "locked", "", ""); t = e; lunchDone = true; continue; }
      if (calls.length && mins >= calls[0]) {
        calls.shift(); const who = desks[ri(1, 4)], ws = who.subs.length ? who.subs[ri(0, who.subs.length - 1)] : "";
        const act = "call:" + who.name + (ws ? " / " + ws : ""); let left = ri(6, 24) * 6e4, src = "call-start";
        for (const p of [who, desks[0], who].slice(0, ri(1, 3))) { const len = Math.min(left, ri(2, 10) * 6e4); if (len <= 0) break; const e = new Date(+t + len); push(t, e, p, p === who ? ws : "", "active", src, act); t = e; left -= len; src = "click"; }
        if (left > 0) { const e = new Date(+t + left); push(t, e, who, ws, "active", "click", act); t = e; }
        continue;
      }
      if (rnd() < 0.07) { const e = new Date(+t + ri(6, 14) * 6e4); push(t, e, null, "", "idle", "idle>5min", ""); t = e; continue; }
      const pool = [...focus, ...focus, ...focus, ...desks.flatMap(x => Array(x.w).fill(x))];
      const dk = rnd() < 0.18 ? desks[0] : pool[ri(0, pool.length - 1)], sub = dk.subs.length ? dk.subs[ri(0, dk.subs.length - 1)] : "";
      let e = new Date(+t + (dk === desks[0] ? ri(2, 14) : ri(6, 75)) * 6e4); if (e > end) e = new Date(end);
      push(t, e, dk, sub, "active", first ? "start" : ["click", "click", "click", "key", "wheel", "other"][ri(0, 5)], ""); t = e; first = false;
    }
    prevEnd = new Date(t);
  }
  return {lang: (navigator.language || "en").slice(0, 2), theme: "", version: "", generated: iso(now),
          desks: desks.map(({id, name, color}) => ({id, name, color})), files: [{name: "demo.csv", text: lines.join("\n")}], live: []};
}

syncDates();
render();
</script>
