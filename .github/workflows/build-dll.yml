name: Build VirtualDesktopAccessor.dll

# Builds the bundled VirtualDesktopAccessor.dll from the unmodified source of
# Ciantic/VirtualDesktopAccessor at a pinned commit. The pinned commit is the
# merge of PR #119, which added the MoveDesktop export DeskTabs needs for
# reordering; no official release ships it yet. Started by hand only; the
# resulting DLL is reviewed and committed to the repository like any other change.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out DeskTabs
        uses: actions/checkout@v4

      - name: Check out VirtualDesktopAccessor (pinned)
        uses: actions/checkout@v4
        with:
          repository: Ciantic/VirtualDesktopAccessor
          ref: ceb648849dcc5760a7f4ed223308ffe3de0b51c6
          path: upstream

      - name: Check that the MoveDesktop export is in the source
        shell: pwsh
        run: |
          if (-not (Select-String -Path upstream/dll/src/lib.rs -Pattern 'fn MoveDesktop' -Quiet)) { throw "MoveDesktop export missing" }

      - name: Build
        shell: pwsh
        working-directory: upstream
        run: |
          rustc --version
          cargo build --release -p dll --locked

      - name: Collect DLL and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item upstream/target/release/VirtualDesktopAccessor.dll out/
          $h = (Get-FileHash out/VirtualDesktopAccessor.dll -Algorithm SHA256).Hash.ToLower()
          "$h  VirtualDesktopAccessor.dll" | Set-Content out/SHA256SUMS.txt -Encoding ascii
          Get-Content out/SHA256SUMS.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: VirtualDesktopAccessor
          path: out/
